name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS (vitest, build, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npx vitest run
      - name: Build
        run: npx vite build
      # Los datos reales no están en el repo (ver .gitignore): los E2E corren sobre la ciudad de
      # demostración hasta que exista la fixture chica del pipeline (T12 en specs/07).
      - name: Ciudad de demostración para los E2E
        run: node tools/demo-ciudad.mjs
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test --reporter=line,html
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    name: Python (pytest de tools/geo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/geo/requirements.txt
      - run: pip install -r tools/geo/requirements.txt
      - name: Tests (todos con imágenes sintéticas)
        run: python -m pytest tools/geo/tests -q
