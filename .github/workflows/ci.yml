name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS (vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npx vitest run
      # solo avisa: un PR del pipeline se fusiona antes de que se puedan publicar sus datos
      - name: ¿Los datos publicados siguen al día?
        if: github.event_name == 'pull_request'
        run: npm run datos:al-dia
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: npx vite build
      # el JS que se baja al abrir, los workers y el service worker no pasan de su tope (specs/10-rendimiento.md)
      - name: Presupuesto del build
        run: node tools/rendimiento/presupuesto-build.mjs

  # Los E2E dibujan por software (SwiftShader) y son lo lento del CI: van en tandas paralelas, por archivo.
  e2e:
    name: E2E (Playwright, tanda ${{ matrix.tanda }} de 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tanda: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Los datos reales no están en el repo (ver .gitignore): los E2E corren sobre la muestra (T12),
      # 1 km² alrededor de la plaza del release datos-* más nuevo, verificada contra su sha256.
      - name: Muestra de datos para los E2E
        run: npm run datos:bajar -- --muestra
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # el release de datos es del repo principal: en un fork, GITHUB_REPOSITORY no tiene ningún datos-*
          DATOS_REPO: grunch/caracas
      - name: Navegador para Playwright
        # --with-deps instala fuentes con apt; si el mirror del runner falla («Unable to locate package»), un
        # segundo intento con el índice recargado suele bastar
        run: npx playwright install --with-deps chromium || (sleep 30 && sudo apt-get update && npx playwright install --with-deps chromium)
      - name: E2E
        run: npx playwright test --shard=${{ matrix.tanda }}/3 --reporter=line,html
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.tanda }}
          path: playwright-report/
          retention-days: 7

  python:
    name: Python (pytest de tools/geo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/geo/requirements.txt
      - run: pip install -r tools/geo/requirements.txt
      - name: Tests (todos con imágenes sintéticas)
        run: python -m pytest tools/geo/tests -q
