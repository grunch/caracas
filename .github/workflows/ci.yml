name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS (vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npx vitest run
      - name: Build
        run: npx vite build

  # Los E2E dibujan por software (SwiftShader) y son lo lento del CI: van en tandas paralelas, por archivo.
  e2e:
    name: E2E (Playwright, tanda ${{ matrix.tanda }} de 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tanda: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Los datos reales no están en el repo (ver .gitignore): los E2E corren sobre la fixture chica, un
      # recorte de 1 km² alrededor de la plaza generado con node tools/fixture.mjs (T12 en specs/07).
      - name: Fixture chica de los datos para los E2E
        run: node tools/fixture.mjs --instalar
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test --shard=${{ matrix.tanda }}/3 --reporter=line,html
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.tanda }}
          path: playwright-report/
          retention-days: 7

  python:
    name: Python (pytest de tools/geo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/geo/requirements.txt
      - run: pip install -r tools/geo/requirements.txt
      - name: Tests (todos con imágenes sintéticas)
        run: python -m pytest tools/geo/tests -q
