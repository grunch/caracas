name: Pages

# Publica el sitio en GitHub Pages en cada push a main. Los datos generados no están en git: se bajan del
# release datos-* más nuevo (npm run datos:bajar, que verifica cada archivo contra su sha256).
# Un release nuevo de datos no lo dispara: el entorno github-pages solo acepta main, y un workflow que
# arranca por un release corre sobre la etiqueta. Por eso npm run datos:publicar lo pide sobre main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Datos del sitio
        run: npm run datos:bajar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # avisa (sin cortar el deploy) si producción va a salir con datos de un pipeline anterior
      - name: ¿Los datos siguen al día con el código?
        run: npm run datos:al-dia
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
