name: Estándar de calidad

# El bot de triaje del estándar de calidad (specs/09-estandar-de-calidad.md § 5): revisa la descripción,
# el issue enlazado, el diff y el tamaño de un PR, y le pone `calidad:ok` o `calidad:falta-info` con un
# solo comentario que lista lo que falta. Solo etiqueta: nunca cierra nada.
#
# pull_request_target corre este workflow y su script tal como están en main, con un token que escribe.
# Es seguro solo porque aquí nada baja ni corre código del PR: el título y la descripción los lee
# tools/triaje/triaje.mjs del payload del evento, como datos, sin pasarlos nunca por una shell; lo demás
# sale de la API. Sin npm ci: el script usa solo la biblioteca estándar de Node.

on:
  pull_request_target:
    # labeled/unlabeled solo importan para `calidad:exento` (ver el if del job)
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  # el check neutral «Estándar de calidad» sobre el último commit
  checks: write

jobs:
  triaje:
    name: Triaje
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'calidad:exento'
    # en el job y no en el workflow: un run con el job salteado (otra etiqueta) no debe cancelar un triaje real
    concurrency:
      group: calidad-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # la rama por defecto, nunca la cabeza ni el merge del PR
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Triaje
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/triaje/triaje.mjs
