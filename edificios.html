<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1a17">
  <title>Caracas, edificio por edificio</title>
  <meta name="description" content="Los edificios de la Caracas de 1772 a 1936, uno por uno: mientras lees, la ciudad en 3D vuela hasta cada uno y le da la vuelta.">
  <link rel="canonical" href="https://caracas.city/edificios.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_VE">
  <meta property="og:url" content="https://caracas.city/edificios.html">
  <meta property="og:title" content="Caracas, edificio por edificio">
  <meta property="og:description" content="Los edificios de la Caracas de 1772 a 1936, uno por uno, con la ciudad en 3D al lado.">
  <link rel="icon" href="data:,">
  <style>
    :root{--fondo:#1d1a17;--papel:#f1e6cd;--tinta:#2a221b;--claro:#efe4cd}
    html,body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    a{color:#8a2a1a;text-underline-offset:2px}
    .cuerpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);min-height:100vh}
    .lista{background:var(--papel);padding:32px clamp(16px,4vw,48px) 40vh}
    .lista header{margin-bottom:40px}
    h1{margin:0;font-size:32px;font-weight:500;line-height:1.15;text-wrap:balance}
    .bajada{margin:8px 0 14px;font-style:italic;opacity:.85}
    .visor-entero{display:inline-block;padding:10px 18px;border:1px solid var(--tinta);color:var(--tinta);text-decoration:none;min-height:24px}
    .visor-entero:hover{background:#fff6e2}
    ol{list-style:none;margin:0;padding:0}
    li{padding:28px 0 40vh;border-top:1px solid #2a221b44}
    li:last-child{padding-bottom:20vh}
    .año{font-variant-numeric:lining-nums;letter-spacing:.06em;opacity:.75}
    h2{margin:2px 0 6px;font-size:24px;font-weight:500}
    .antes{margin:0 0 8px;font-style:italic;opacity:.8}
    li p{margin:0;max-width:34em;text-wrap:pretty}
    li.activo h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
    .vista{position:sticky;top:0;height:100vh}
    .vista iframe{display:block;width:100%;height:100%;border:0;background:var(--fondo)}
    @media (max-width:760px){
      .cuerpo{grid-template-columns:1fr}
      .vista{order:-1;height:42vh;z-index:1}
      .lista{padding-top:20px}
      li{padding-bottom:30vh}
    }
    :focus-visible{outline:2px solid currentColor;outline-offset:2px}
  </style>
</head>
<body>
  <div class="cuerpo">
    <main class="lista">
      <header>
        <h1>Caracas, edificio por edificio</h1>
        <p class="bajada">Los edificios modelados de la ciudad, en el orden en que aparecen. Mientras lees, la ciudad vuela hasta cada uno y le da la vuelta, en el año en que aparece.</p>
        <a class="visor-entero" href="./">Abrir el visor entero</a>
      </header>
      <ol id="edificios" aria-label="Edificios"></ol>
    </main>
    <div class="vista">
      <iframe id="vitrina" title="La ciudad en 3D, en el edificio que estás leyendo" src="./?vitrina&sinintro" loading="eager"></iframe>
    </div>
  </div>
  <script type="module" src="/src/edificios.js"></script>
</body>
</html>
